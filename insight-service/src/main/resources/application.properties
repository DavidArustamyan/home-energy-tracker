spring.application.name=insight-service
server.port=8085

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

usage.service.url = http://localhost:8083/api/v1/usage

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.ollama.chat.model=deepseek-coder
spring.ai.ollama.init.pull-model-strategy=never
#spring.ai.ollama.init.max-retries=2
#spring.ai.retry.max-attempts=2